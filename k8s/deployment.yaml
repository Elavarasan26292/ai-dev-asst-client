apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-dev-asst-client
  namespace: default
  labels:
    app: ai-dev-asst-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-dev-asst-client
  template:
    metadata:
      labels:
        app: ai-dev-asst-client
    spec:
      containers:
        - name: ai-dev-asst-client
          image: devasst.azurecr.io/ai-dev-asst-client:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
