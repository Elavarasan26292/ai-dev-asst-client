trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: "devasst-acr-connection"
  azureSubscriptionServiceConnection: "devasst-aks-connection"
  azureResourceGroup: "VisualStudioOnline-C40A3787E31A48EEBA3DE3DDB8EF0511"
  kubernetesCluster: "devasst-aks"
  apiBaseUrl: "https://ai-dev-asst-client.southindia.cloudapp.azure.com/api"
  letsEncryptEmail: "elavarasan.web.developer@gmail.com"
  imageRepository: "ai-dev-asst-client"
  imageTag: "$(Build.BuildId)"

steps:
  - task: NodeTool@0
    displayName: Install Node.js 22
    inputs:
      versionSpec: "22.x"

  - script: npm ci
    displayName: Install client dependencies

  - script: npm run lint
    displayName: Run client lint checks

  - script: npm run build
    displayName: Build and type-check client

  - task: Docker@2
    displayName: Build client image
    inputs:
      command: build
      containerRegistry: $(dockerRegistryServiceConnection)
      repository: $(imageRepository)
      Dockerfile: "$(Build.SourcesDirectory)/Dockerfile"
      buildContext: "$(Build.SourcesDirectory)"
      arguments: "--build-arg VITE_API_BASE_URL=$(apiBaseUrl)"
      tags: |
        $(imageTag)
        latest

  - task: Docker@2
    displayName: Push client image
    inputs:
      command: push
      containerRegistry: $(dockerRegistryServiceConnection)
      repository: $(imageRepository)
      tags: |
        $(imageTag)
        latest

  - bash: |
      set -euo pipefail
      if [[ "$(letsEncryptEmail)" == *REPLACE_WITH_* ]]; then
        echo "Set letsEncryptEmail before deployment."
        exit 1
      fi

      export IMAGE_TAG="$(imageTag)"
      export LETS_ENCRYPT_EMAIL="$(letsEncryptEmail)"
      mkdir -p "$(Build.ArtifactStagingDirectory)/k8s"
      envsubst '${IMAGE_TAG}' \
        < "$(Build.SourcesDirectory)/k8s/deployment.yaml" \
        > "$(Build.ArtifactStagingDirectory)/k8s/deployment.yaml"
      cp "$(Build.SourcesDirectory)/k8s/service.yaml" \
        "$(Build.ArtifactStagingDirectory)/k8s/service.yaml"
      envsubst '${LETS_ENCRYPT_EMAIL}' \
        < "$(Build.SourcesDirectory)/k8s/cluster-issuer.yaml" \
        > "$(Build.ArtifactStagingDirectory)/k8s/cluster-issuer.yaml"
      cp "$(Build.SourcesDirectory)/k8s/ingress.yaml" \
        "$(Build.ArtifactStagingDirectory)/k8s/ingress.yaml"
    displayName: Render Kubernetes manifests

  - task: AzureCLI@2
    displayName: Install HTTPS ingress prerequisites
    inputs:
      azureSubscription: $(azureSubscriptionServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        az aks get-credentials \
          --resource-group "$(azureResourceGroup)" \
          --name "$(kubernetesCluster)" \
          --overwrite-existing

        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        helm repo add jetstack https://charts.jetstack.io
        helm repo update

        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
          --namespace ingress-nginx \
          --create-namespace \
          --set controller.ingressClassResource.name=nginx \
          --set controller.ingressClass=nginx \
          --wait

        kubectl annotate service ingress-nginx-controller \
          --namespace ingress-nginx \
          service.beta.kubernetes.io/azure-dns-label-name=ai-dev-asst-client \
          --overwrite

        helm upgrade --install cert-manager jetstack/cert-manager \
          --namespace cert-manager \
          --create-namespace \
          --set crds.enabled=true \
          --wait

  - task: KubernetesManifest@1
    displayName: Deploy client to AKS
    inputs:
      action: deploy
      connectionType: azureResourceManager
      azureSubscriptionConnection: $(azureSubscriptionServiceConnection)
      azureResourceGroup: $(azureResourceGroup)
      kubernetesCluster: $(kubernetesCluster)
      namespace: default
      manifests: |
        $(Build.ArtifactStagingDirectory)/k8s/cluster-issuer.yaml
        $(Build.ArtifactStagingDirectory)/k8s/deployment.yaml
        $(Build.ArtifactStagingDirectory)/k8s/service.yaml
        $(Build.ArtifactStagingDirectory)/k8s/ingress.yaml
      containers: |
        devasst.azurecr.io/$(imageRepository):$(imageTag)
